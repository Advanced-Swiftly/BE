services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawfit}
      POSTGRES_USER: ${POSTGRES_USER:-pawfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawfit-local}
    ports:
      - "5432:5432"
    volumes:
      - pawfit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawfit} -d ${POSTGRES_DB:-pawfit}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pawfit-postgres:
