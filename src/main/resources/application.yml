spring:
  application:
    name: pawfit-api
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

pawfit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:pawfit}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
    allowed-content-types: ${STORAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,application/pdf}
    signed-url-ttl: ${STORAGE_SIGNED_URL_TTL:5m}
    timeout: ${STORAGE_TIMEOUT:10s}
  ai:
    provider: ${AI_PROVIDER:GEMINI}
    timeout: ${AI_TIMEOUT:30s}
    max-retries: ${AI_MAX_RETRIES:2}
    retry-delay: ${AI_RETRY_DELAY:500ms}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
    workers-ai:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
      text-model: ${CLOUDFLARE_TEXT_MODEL:@cf/meta/llama-3.1-8b-instruct}
      vision-model: ${CLOUDFLARE_VISION_MODEL:@cf/meta/llama-3.2-11b-vision-instruct}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
