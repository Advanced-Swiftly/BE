spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # ERD가 PostgreSQL migration으로 확정되기 전까지 Entity 기준으로 필요한 표를 생성·보정합니다.
      # 전체 Flyway schema가 준비되면 Render에서 JPA_DDL_AUTO=validate로 전환합니다.
      ddl-auto: ${JPA_DDL_AUTO:update}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # Supabase는 새 프로젝트도 public schema에 system object가 존재하므로
    # 최초 배포에서 version 0 baseline을 만든 뒤 모든 migration을 적용합니다.
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    root: INFO
    com.advancedswiftly.pawfit: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
