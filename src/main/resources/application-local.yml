spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawfit}
    username: ${DB_USERNAME:pawfit}
    password: ${DB_PASSWORD:pawfit-local}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.advancedswiftly.pawfit: DEBUG
